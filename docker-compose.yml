
services:
  agy-bridge:
    build: .
    container_name: rocketchat-agy-bridge
    ports:
      - "8080:8080"
    environment:
      - CHAT_PROVIDER=${CHAT_PROVIDER:-rocketchat}
      - ROCKETCHAT_TOKEN=${ROCKETCHAT_TOKEN:-}
      - ROCKETCHAT_USER_ID=${ROCKETCHAT_USER_ID:-}
      - ROCKETCHAT_PAT=${ROCKETCHAT_PAT:-}
      - ROCKETCHAT_URL=${ROCKETCHAT_URL:-http://rocketchat.example.com:3000}
      - MATTERMOST_TOKEN=${MATTERMOST_TOKEN:-}
      - MATTERMOST_PAT=${MATTERMOST_PAT:-}
      - MATTERMOST_URL=${MATTERMOST_URL:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_VERIFICATION_TOKEN=${SLACK_VERIFICATION_TOKEN:-}
      - GITEA_PAT=${GITEA_PAT:-}
      - GEMINI_API=${GEMINI_API:-}
    volumes:
      - ./workspace:/workspace
      - ./.gemini:/root/.gemini
      - ./skills:/root/.gemini/antigravity-cli/skills
    restart: unless-stopped
