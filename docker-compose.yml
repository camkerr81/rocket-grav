services:
  agy-bridge:
    build: .
    container_name: rocketchat-agy-bridge
    ports:
      - "8080:8080"
    environment:
      - CHAT_PROVIDER=${CHAT_PROVIDER:-rocketchat}
      - ROCKETCHAT_TOKEN=${ROCKETCHAT_TOKEN:-}
      - ROCKETCHAT_USER_ID=${ROCKETCHAT_USER_ID:-}
      - ROCKETCHAT_PAT=${ROCKETCHAT_PAT:-}
      - ROCKETCHAT_URL=${ROCKETCHAT_URL:-http://192.168.8.177:3100}
      - ALLOWED_IPS=${ALLOWED_IPS:-}
      - DISABLE_IP_FILTER=${DISABLE_IP_FILTER:-false}
      - MATTERMOST_TOKEN=${MATTERMOST_TOKEN:-}
      - MATTERMOST_PAT=${MATTERMOST_PAT:-}
      - MATTERMOST_URL=${MATTERMOST_URL:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_VERIFICATION_TOKEN=${SLACK_VERIFICATION_TOKEN:-}
      - GITEA_PAT=${GITEA_PAT:-}
      - GEMINI_API=${GEMINI_API:-}
      - BW_CLIENTID=${BW_CLIENTID:-}
      - BW_CLIENTSECRET=${BW_CLIENTSECRET:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://192.168.8.194:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
      - HYBRID_MODE=${HYBRID_MODE:-true}
    volumes:
      - ./workspace:/workspace
      - ./.gemini:/root/.gemini
      - ./skills:/root/.gemini/antigravity-cli/skills
    restart: unless-stopped
